<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Seite finden · Sport Event Map</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #101a27; color: #f3f7fa; }
    main { max-width: 560px; margin: 12vh auto; }
    h1 { line-height: 1.2; font-size: 2rem; }
    p { line-height: 1.6; color: #d0dbe7; }
    a { display: inline-block; padding: 12px 18px; border-radius: 10px; background: #87df71; color: #102019; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
  <script id="event-route-recovery">
    (() => {
      // Pages serves existing static event pages first. Only missing, exact
      // event routes recover through the current public catalog.
      const pathname = window.location.pathname;
      const event = /^\/event\/([a-z0-9]+(?:-[a-z0-9]+)*)(?:\/|\/index\.html)?$/.exec(pathname);
      if (event) {
        window.location.replace('/index.html#/event/' + encodeURIComponent(event[1]));
      } else if (/^\/admin(?:\.html|\/)?$/.test(pathname)) {
        window.location.replace('/index.html#/admin');
      }
    })();
  </script>
</head>
<body>
  <main>
    <p>Sport Event Map</p>
    <h1>Diese Seite ist nicht verfügbar.</h1>
    <p>Du kannst in der Eventsuche nach der Veranstaltung suchen und ihre aktuellen Informationen aufrufen.</p>
    <a href="/index.html#/discovery">Zur Eventsuche</a>
  </main>
</body>
</html>
