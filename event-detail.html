<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Eventdetails · Sport Event Map</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css?v=20260929-detail-layout-v130">
  <script src="/js/theme.js?v=20260725-publish-runtime-v96"></script>
  <script src="/js/config.js"></script>
  <script defer src="/js/supabase-loader.js" data-supabase-src="/js/event-detail-supabase.js?v=20260725-publish-runtime-v96"></script>
  <script defer src="/js/event-detail-live.js?v=20260929-detail-layout-v131"></script>
</head>
<body class="event-detail-page">
  <main class="event-detail-shell">
    <header class="event-detail-header" id="liveDetailHeader">
      <a class="event-detail-back" id="liveDetailBack" href="/index.html#/discovery" data-live-i18n="back">Zur Karte</a>
      <a class="event-detail-brand brand" href="/index.html#/discovery"><img class="brand-icon" src="/assets/brand/sport-event-map-icon.svg" alt=""><span class="brand-name">Sport Event Map</span></a>
      <label class="event-detail-language-control"><span data-live-i18n="language">Sprache</span><select id="eventDetailLanguageSelect" aria-label="Sprache"><option value="de">DE</option><option value="en">EN</option></select></label>
    </header>
    <div id="liveDetailStatus" class="live-detail-notice" role="status" aria-live="polite"><span data-live-i18n="loading">Eventdetails werden geladen …</span></div>
    <noscript><p>Bitte aktiviere JavaScript, um die aktuellen Eventdetails anzuzeigen. <a href="/index.html#/discovery">Zur Eventsuche</a></p></noscript>
    <button id="liveDetailRetry" class="event-detail-secondary" type="button" hidden data-live-i18n="retry">Erneut versuchen</button>
    <article id="liveDetailContent" hidden>
      <section class="event-detail-hero race-guide-hero">
        <div class="event-detail-hero-main"><span id="liveDetailSport" class="event-detail-kicker"></span><h1 id="liveDetailName"></h1><p id="liveDetailLocation"></p></div>
        <div class="event-detail-cta-card">
          <p class="event-detail-status-note" data-live-i18n="verify">Bitte prüfe die endgültigen Angaben vor der Anmeldung beim Veranstalter.</p>
          <div class="event-detail-action-group"><button class="event-detail-secondary" id="addDetailEventToSeason" type="button" disabled data-live-i18n="detail.addSeason">Zur Saison hinzufügen</button><a class="event-detail-primary" id="liveDetailOfficial" target="_blank" rel="noopener noreferrer" hidden data-live-i18n="official">Offizielle Website / Anmeldung</a></div>
          <p class="event-detail-action-status" id="detailActionStatus" role="status" aria-live="polite"></p>
        </div>
      </section>
      <nav id="liveDetailNavigation" class="event-detail-tabs race-guide-tabs" aria-label="Eventdetails"><a href="#key-facts" data-detail-section="key-facts" data-live-i18n="facts">Überblick</a><a href="#description" data-detail-section="description" data-live-i18n="description">Beschreibung</a><a href="#sources" data-detail-section="sources" data-live-i18n="sources">Quellen</a></nav>
      <section id="key-facts" class="event-detail-card race-guide-section"><div class="race-guide-section-heading"><span data-live-i18n="facts">Überblick</span><h2 data-live-i18n="facts">Überblick</h2></div><div id="liveDetailFacts" class="race-guide-fact-grid live-detail-facts"></div></section>
      <section id="description" class="event-detail-card race-guide-section"><h2 data-live-i18n="description">Beschreibung</h2><p id="liveDetailDescription" class="live-detail-copy"></p></section>
      <div id="liveDetailSections" class="live-detail-sections"></div>
      <section id="sources" class="event-detail-card race-guide-section"><h2 data-live-i18n="sources">Quellen</h2><p id="liveDetailChecked" hidden></p><a id="liveDetailSource" class="event-detail-secondary" target="_blank" rel="noopener noreferrer" hidden data-live-i18n="source">Quelle öffnen</a><div id="liveDetailSources" class="event-source-list"></div></section>
    </article>
    <footer class="live-detail-footer"><a href="/imprint.html" data-live-i18n="imprint">Impressum</a><a href="/privacy.html" data-live-i18n="privacy">Datenschutz</a></footer>
  </main>
</body>
</html>
